name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test test/*.test.mjs

      - name: Build source archive
        run: git archive --format=tar.gz --prefix="${GITHUB_REF_NAME}/" -o "${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}.tar.gz" --title "${GITHUB_REF_NAME}" --generate-notes
